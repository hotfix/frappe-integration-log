name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please remove credentials, URLs of your systems and
        personal data from everything you paste below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. Include the error message, if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If a consumer app is involved, include its `integration_logs` hook entry.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: frappe-version
    attributes:
      label: Frappe version
      placeholder: e.g. 16.x.y
    validations:
      required: true
  - type: input
    id: erpnext-version
    attributes:
      label: ERPNext version
      description: Leave empty if ERPNext is not installed.
      placeholder: e.g. 16.x.y
  - type: input
    id: app-version
    attributes:
      label: integration_log version
      description: Release tag or commit hash.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: 'The Error Log traceback (for example "Integration Log: invalid registry entry") or the browser console output.'
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have removed credentials and personal data (names, addresses, email addresses) from this report.
          required: true
